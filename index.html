<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 • hosting expired</title>
  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #0e121f 0%, #1a1f30 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    /* animated background orbs – cool & dreamy */
    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.25;
      z-index: 0;
      animation: floatOrb 22s ease-in-out infinite alternate;
    }

    body::before {
      width: 45vw;
      height: 45vw;
      background: #f97316;
      top: -12vh;
      left: -8vw;
      animation-delay: -2s;
    }

    body::after {
      width: 40vw;
      height: 40vw;
      background: #d946ef;
      bottom: -10vh;
      right: -6vw;
      animation-delay: -8s;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(8vw, 10vh) scale(1.3); }
    }

    /* main glass card */
    .error-card {
      position: relative;
      z-index: 10;
      max-width: 720px;
      width: 100%;
      background: rgba(16, 22, 40, 0.6);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-radius: 3.5rem;
      padding: 3rem 2.5rem;
      text-align: center;
      box-shadow: 
        0 30px 60px -20px rgba(0, 0, 0, 0.9),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }

    .error-card:hover {
      transform: scale(1.005);
      box-shadow: 0 40px 70px -20px #000000cc;
    }

    /* 404 number – gradient + glow */
    .error-code {
      font-size: clamp(6.5rem, 18vw, 10.5rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      line-height: 1;
      background: linear-gradient(135deg, #fb923c, #f97316, #d946ef);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 40px rgba(249, 115, 22, 0.25);
      margin-bottom: 0.2rem;
      display: inline-block;
      position: relative;
    }

    /* subtle underline glow */
    .error-code::after {
      content: '';
      position: absolute;
      left: 10%;
      bottom: -8px;
      width: 80%;
      height: 4px;
      background: linear-gradient(90deg, transparent, #fb923c, #d946ef, transparent);
      filter: blur(5px);
      border-radius: 4px;
      opacity: 0.7;
    }

    /* status badge – hosting expired */
    .status-badge {
      display: inline-block;
      background: rgba(249, 115, 22, 0.15);
      backdrop-filter: blur(4px);
      padding: 0.4rem 1.4rem;
      border-radius: 60px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #fb923c;
      border: 1px solid rgba(249, 115, 22, 0.2);
      letter-spacing: 0.4px;
      margin-top: 0.2rem;
      margin-bottom: 0.8rem;
      box-shadow: 0 0 20px rgba(249, 115, 22, 0.05);
    }

    .status-badge i {
      margin-right: 8px;
      font-size: 0.9rem;
      color: #f97316;
    }

    .error-title {
      font-size: clamp(1.6rem, 5vw, 2.6rem);
      font-weight: 600;
      color: #f0f3fa;
      margin: 1rem 0 0.4rem;
      letter-spacing: -0.02em;
    }

    .error-message {
      font-size: clamp(1rem, 2.2vw, 1.25rem);
      color: #b9c8e6;
      margin: 0.6rem 0 1.6rem;
      padding: 0 0.5rem;
      line-height: 1.6;
      font-weight: 400;
      opacity: 0.9;
    }

    .error-message strong {
      color: #fb923c;
      font-weight: 600;
    }

    /* divider */
    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin: 0.8rem 0 1.8rem;
    }

    .divider-line {
      height: 2px;
      flex: 1;
      max-width: 70px;
      background: linear-gradient(90deg, transparent, rgba(251, 146, 60, 0.3), transparent);
    }

    .divider-icon {
      color: rgba(251, 146, 60, 0.5);
      font-size: 1rem;
    }

    /* primary CTA – contact provider */
    .btn-contact {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      background: linear-gradient(135deg, #f97316, #ea580c);
      border: none;
      padding: 0.9rem 2.8rem;
      border-radius: 60px;
      font-size: 1.2rem;
      font-weight: 600;
      color: #ffffff;
      text-decoration: none;
      transition: all 0.25s ease;
      box-shadow: 0 8px 28px -6px #b45309;
      border: 1px solid rgba(255, 255, 255, 0.12);
      letter-spacing: 0.3px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .btn-contact i {
      font-size: 1.1rem;
      transition: transform 0.2s ease;
    }

    .btn-contact:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 16px 36px -8px #b45309;
      background: linear-gradient(135deg, #fb923c, #ea580c);
      color: #fff;
    }

    .btn-contact:hover i {
      transform: translateX(-4px);
    }

    .btn-contact:active {
      transform: scale(0.96);
      box-shadow: 0 4px 12px -2px #7c3a0a;
    }

    /* shine effect */
    .btn-contact::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -30%;
      width: 40%;
      height: 200%;
      background: linear-gradient(120deg, rgba(255, 255, 255, 0.2), transparent);
      transform: rotate(20deg);
      transition: all 0.6s ease;
      pointer-events: none;
    }

    .btn-contact:hover::after {
      left: 110%;
    }

    /* secondary subtle link – "check status" */
    .secondary-link {
      display: inline-block;
      margin-top: 1.4rem;
      font-size: 0.9rem;
      color: #8b9bc7;
      text-decoration: none;
      border-bottom: 1px dashed rgba(139, 155, 199, 0.25);
      padding-bottom: 2px;
      transition: color 0.2s, border-color 0.2s;
    }

    .secondary-link i {
      margin-right: 6px;
      font-size: 0.8rem;
    }

    .secondary-link:hover {
      color: #fb923c;
      border-color: #fb923c;
    }

    /* responsive */
    @media (max-width: 500px) {
      .error-card {
        padding: 2rem 1.5rem;
        border-radius: 2.5rem;
      }

      .btn-contact {
        padding: 0.75rem 2rem;
        font-size: 1rem;
        gap: 0.6rem;
      }

      .divider-line {
        max-width: 35px;
      }
    }

    @media (max-width: 380px) {
      .error-card {
        padding: 1.5rem 1rem;
      }
      .error-code {
        font-size: 5.2rem;
      }
    }

    /* floating ghost (fun) */
    .ghost-icon {
      font-size: 2rem;
      color: rgba(251, 146, 60, 0.12);
      position: absolute;
      bottom: 1rem;
      right: 1.5rem;
      pointer-events: none;
      animation: floatGhost 7s ease-in-out infinite;
    }

    @keyframes floatGhost {
      0% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(6deg); }
      100% { transform: translateY(0) rotate(0deg); }
    }

    /* small corner badge (status) */
    .corner-badge {
      position: absolute;
      top: 1rem;
      right: 1.5rem;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(4px);
      padding: 0.2rem 1rem;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 500;
      color: #a0b3d9;
      border: 1px solid rgba(255, 255, 255, 0.03);
      letter-spacing: 0.5px;
      z-index: 20;
      pointer-events: none;
    }

    .corner-badge i {
      margin-right: 5px;
      color: #f97316;
    }
  </style>
</head>
<body>
  <div class="error-card" role="main" aria-labelledby="error-title">
    <!-- corner badge -->
    <div class="corner-badge">
      <i class="fas fa-exclamation-triangle"></i> hosting expired
    </div>

    <!-- 404 -->
    <div class="error-code" aria-hidden="true">404</div>

    <!-- status badge (hosting expired) -->
    <div class="status-badge">
      <i class="fas fa-clock"></i> hosting package expired
    </div>

    <h1 id="error-title" class="error-title">Service temporarily offline</h1>
    <p class="error-message">
      Your <strong>hosting package has expired</strong>.  
      To restore access, please <strong>contact your service provider</strong> and renew your plan.
    </p>

    <!-- divider -->
    <div class="divider">
      <span class="divider-line"></span>
      <span class="divider-icon"><i class="fas fa-circle"></i></span>
      <span class="divider-line"></span>
    </div>

    <!-- primary CTA: contact provider -->
    <a href="#" class="btn-contact" id="contactBtn">
      <i class="fas fa-headset"></i> Contact service provider
    </a>

    <!-- secondary link (optional) -->
    <a href="#" class="secondary-link" id="checkStatusLink">
      <i class="fas fa-sync-alt"></i> Check renewal status
    </a>

    <!-- ghost decoration -->
    <div class="ghost-icon" aria-hidden="true">
      <i class="fas fa-cloud"></i>
    </div>
  </div>

  <script>
    (function() {
      // Contact button – interactive demo
      const contactBtn = document.getElementById('contactBtn');
      const statusLink = document.getElementById('checkStatusLink');

      if (contactBtn) {
        contactBtn.addEventListener('click', function(e) {
          e.preventDefault();
          // simulate "contacting" action
          const originalHTML = contactBtn.innerHTML;
          contactBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Connecting…';
          contactBtn.style.pointerEvents = 'none';
          contactBtn.style.opacity = '0.8';

          setTimeout(() => {
            contactBtn.innerHTML = '<i class="fas fa-check-circle"></i> Request sent!';
            contactBtn.style.background = 'linear-gradient(135deg, #34d399, #10b981)';
            contactBtn.style.boxShadow = '0 8px 24px -4px #10b981';

            // reset after 2s
            setTimeout(() => {
              contactBtn.innerHTML = originalHTML;
              contactBtn.style.background = '';
              contactBtn.style.boxShadow = '';
              contactBtn.style.pointerEvents = 'auto';
              contactBtn.style.opacity = '1';
              // in production: window.location.href = 'mailto:support@provider.com';
            }, 2000);
          }, 1200);
        });
      }

      // secondary link – "check status" feedback
      if (statusLink) {
        statusLink.addEventListener('click', function(e) {
          e.preventDefault();
          const originalText = statusLink.innerHTML;
          statusLink.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Checking…';
          statusLink.style.pointerEvents = 'none';
          statusLink.style.opacity = '0.7';

          setTimeout(() => {
            statusLink.innerHTML = '<i class="fas fa-exclamation-circle"></i> Expired · renew now';
            statusLink.style.color = '#fb923c';
            statusLink.style.borderColor = '#fb923c';

            setTimeout(() => {
              statusLink.innerHTML = originalText;
              statusLink.style.color = '';
              statusLink.style.borderColor = '';
              statusLink.style.pointerEvents = 'auto';
              statusLink.style.opacity = '1';
            }, 1800);
          }, 1000);
        });
      }

      // small console easter egg
      console.log('%c📦 hosting expired · contact provider · 404', 'font-size:14px; font-weight:bold; background:#1a1f30; color:#fb923c; padding:5px 14px; border-radius:30px;');
    })();
  </script>
</body>
</html>
