<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 • Page not found</title>
  <!-- Font Awesome for a crisp icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #0b0e1a 0%, #141b2b 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    /* animated background glow orbs */
    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.3;
      z-index: 0;
      animation: floatOrb 18s ease-in-out infinite alternate;
    }

    body::before {
      width: 40vw;
      height: 40vw;
      background: #6c5ce7;
      top: -10vh;
      left: -5vw;
      animation-delay: 0s;
    }

    body::after {
      width: 35vw;
      height: 35vw;
      background: #00b4d8;
      bottom: -8vh;
      right: -5vw;
      animation-delay: -6s;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(6vw, 8vh) scale(1.2); }
    }

    /* main card – glassmorphism + responsive */
    .error-card {
      position: relative;
      z-index: 10;
      max-width: 700px;
      width: 100%;
      background: rgba(18, 26, 40, 0.55);
      backdrop-filter: blur(14px) saturate(180%);
      -webkit-backdrop-filter: blur(14px) saturate(180%);
      border-radius: 3.5rem;
      padding: 3rem 2.5rem;
      text-align: center;
      box-shadow: 
        0 30px 50px -20px rgba(0, 0, 0, 0.8),
        inset 0 1px 2px rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: transform 0.25s ease, box-shadow 0.3s ease;
    }

    .error-card:hover {
      transform: scale(1.01);
      box-shadow: 0 40px 60px -20px #000000cc;
    }

    /* 404 number with gradient & glow */
    .error-code {
      font-size: clamp(6rem, 18vw, 10rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      line-height: 1;
      background: linear-gradient(135deg, #a78bfa, #60a5fa, #34d399);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 30px rgba(96, 165, 250, 0.3);
      margin-bottom: 0.25rem;
      position: relative;
      display: inline-block;
    }

    /* subtle underline glow */
    .error-code::after {
      content: '';
      position: absolute;
      left: 10%;
      bottom: -8px;
      width: 80%;
      height: 4px;
      background: linear-gradient(90deg, transparent, #60a5fa, #a78bfa, transparent);
      filter: blur(4px);
      border-radius: 4px;
      opacity: 0.6;
    }

    .error-title {
      font-size: clamp(1.6rem, 5vw, 2.6rem);
      font-weight: 600;
      color: #f0f3fa;
      margin: 1.2rem 0 0.5rem;
      letter-spacing: -0.02em;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    .error-message {
      font-size: clamp(1rem, 2.2vw, 1.25rem);
      color: #b9c8e6;
      margin: 0.75rem 0 2rem;
      padding: 0 0.5rem;
      line-height: 1.6;
      font-weight: 400;
      opacity: 0.9;
    }

    /* cool decorative divider */
    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin: 1.2rem 0 1.8rem;
    }

    .divider-line {
      height: 2px;
      flex: 1;
      max-width: 80px;
      background: linear-gradient(90deg, transparent, rgba(167, 139, 250, 0.4), transparent);
    }

    .divider-icon {
      color: rgba(167, 139, 250, 0.6);
      font-size: 1.2rem;
    }

    /* action button – with shine & hover */
    .btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      background: linear-gradient(135deg, #6c5ce7, #4f46e5);
      border: none;
      padding: 0.9rem 2.8rem;
      border-radius: 60px;
      font-size: 1.2rem;
      font-weight: 600;
      color: #ffffff;
      text-decoration: none;
      transition: all 0.25s ease;
      box-shadow: 0 8px 24px -6px #3b2f9e;
      border: 1px solid rgba(255, 255, 255, 0.1);
      letter-spacing: 0.3px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .btn-home i {
      font-size: 1.2rem;
      transition: transform 0.2s ease;
    }

    .btn-home:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 16px 32px -8px #3b2f9e;
      background: linear-gradient(135deg, #7c6cf0, #5b52f0);
      color: #fff;
    }

    .btn-home:hover i {
      transform: translateX(-4px);
    }

    .btn-home:active {
      transform: scale(0.96);
      box-shadow: 0 4px 12px -2px #2a1f7a;
    }

    /* tiny shine effect on button */
    .btn-home::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -30%;
      width: 40%;
      height: 200%;
      background: linear-gradient(120deg, rgba(255, 255, 255, 0.2), transparent);
      transform: rotate(20deg);
      transition: all 0.5s ease;
      pointer-events: none;
    }

    .btn-home:hover::after {
      left: 110%;
    }

    /* responsive fine-tuning */
    @media (max-width: 500px) {
      .error-card {
        padding: 2rem 1.5rem;
        border-radius: 2.5rem;
      }

      .btn-home {
        padding: 0.75rem 2rem;
        font-size: 1rem;
        gap: 0.6rem;
      }

      .divider-line {
        max-width: 40px;
      }
    }

    @media (max-width: 380px) {
      .error-card {
        padding: 1.5rem 1rem;
      }
      .error-code {
        font-size: 5rem;
      }
    }

    /* extra small polish: hide overflow */
    .error-card * {
      position: relative;
      z-index: 2;
    }

    /* fun floating icon (optional) */
    .ghost-icon {
      font-size: 2.2rem;
      color: rgba(167, 139, 250, 0.2);
      position: absolute;
      bottom: 1rem;
      right: 1.5rem;
      pointer-events: none;
      animation: floatGhost 6s ease-in-out infinite;
    }

    @keyframes floatGhost {
      0% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(4deg); }
      100% { transform: translateY(0) rotate(0deg); }
    }

    /* status code in corner – subtle */
    .status-badge {
      position: absolute;
      top: 1.2rem;
      right: 1.8rem;
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(4px);
      padding: 0.2rem 1rem;
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 500;
      color: #8b9bc7;
      border: 1px solid rgba(255, 255, 255, 0.04);
      letter-spacing: 0.6px;
      z-index: 20;
      pointer-events: none;
    }

    .status-badge i {
      margin-right: 6px;
      color: #6c8cff;
    }
  </style>
</head>
<body>
  <div class="error-card" role="main" aria-labelledby="error-title">
    <!-- subtle status badge -->
    <div class="status-badge">
      <i class="fas fa-code"></i> 404 · not found
    </div>

    <!-- 404 big number -->
    <div class="error-code" aria-hidden="true">404</div>

    <!-- title & message -->
    <h1 id="error-title" class="error-title">Page lost in space</h1>
    <p class="error-message">
      The page you’re looking for doesn’t exist or moved.  
      Let’s get you back on track.
    </p>

    <!-- decorative divider -->
    <div class="divider">
      <span class="divider-line"></span>
      <span class="divider-icon"><i class="fas fa-asterisk"></i></span>
      <span class="divider-line"></span>
    </div>

    <!-- return home button -->
    <a href="#" class="btn-home" id="returnHomeBtn">
      <i class="fas fa-arrow-left"></i> Return home
    </a>

    <!-- tiny ghost for fun (purely decorative) -->
    <div class="ghost-icon" aria-hidden="true">
      <i class="fas fa-ghost"></i>
    </div>
  </div>

  <script>
    (function() {
      // Make the "Return home" button interactive – cool alert + redirect simulation
      const returnBtn = document.getElementById('returnHomeBtn');

      if (returnBtn) {
        returnBtn.addEventListener('click', function(e) {
          e.preventDefault(); // prevent default anchor behavior

          // provide a smooth UX: simulate return with a micro-interaction
          const originalText = returnBtn.innerHTML;
          returnBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Taking you home…';
          returnBtn.style.pointerEvents = 'none';
          returnBtn.style.opacity = '0.85';

          // after a short delay, show a success toast-like message and reset
          setTimeout(() => {
            // you could redirect to '/' here, but for demo we show a message
            returnBtn.innerHTML = '<i class="fas fa-check-circle"></i> Welcome back!';
            returnBtn.style.background = 'linear-gradient(135deg, #34d399, #10b981)';
            returnBtn.style.boxShadow = '0 8px 24px -4px #10b981';

            // reset after 1.8s
            setTimeout(() => {
              returnBtn.innerHTML = originalText;
              returnBtn.style.background = '';
              returnBtn.style.boxShadow = '';
              returnBtn.style.pointerEvents = 'auto';
              returnBtn.style.opacity = '1';
              // optional: actual redirect would be: window.location.href = '/';
            }, 1800);
          }, 900);
        });
      }

      // Bonus: tiny console easter egg (for devs)
      console.log('%c👻 404 page · cool responsive · return code', 'font-size:16px; font-weight:bold; background:#141b2b; color:#a78bfa; padding:6px 12px; border-radius:30px;');
    })();
  </script>
</body>
</html>
